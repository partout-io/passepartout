name: passepartout
description: Universal Passepartout VPN profile manager (phase 1)
publish_to: "none"
version: 0.0.1

environment:
  sdk: ">=3.13.0 <4.0.0"
  flutter: ">=3.47.0"
platforms:
  web:
  android:
  ios:
  linux:
  macos:
  windows:

dependencies:
  flutter:
    sdk: flutter
  uuid: ^4.5.1
  ffi: ^2.1.4
  go_router: ^14.2.0
  dio: ^5.5.0
  dartvel_core: 
    path: /home/sigmadev/dartvel_dev/packages/dartvel_core
  dartvel_shelf: 
    path: /home/sigmadev/dartvel_dev/packages/dartvel_shelf
  dartvel_flutter: 
    path: /home/sigmadev/dartvel_dev/packages/dartvel_flutter
  flutter_web_plugins:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  ffigen: ^20.1.1
  yaml: ^3.1.2
  lints: ^4.0.0
  dartvel_cli: 
    path: /home/sigmadev/dartvel_dev/packages/dartvel_cli
dependency_overrides:
  dartvel_core:
    path: /home/sigmadev/dartvel_dev/packages/dartvel_core
  dartvel_shelf:
    path: /home/sigmadev/dartvel_dev/packages/dartvel_shelf
  dartvel_flutter:
    path: /home/sigmadev/dartvel_dev/packages/dartvel_flutter
  dartvel_cli:
    path: /home/sigmadev/dartvel_dev/packages/dartvel_cli

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/credits/
    - assets/tray/

dartvel:
  org: io.partout
  backendHost: 127.0.0.1
  backendPort: 3187
  devBackendHost: http://localhost:3187
  prodBackendHost: http://localhost:3187
  pagesDir: lib/pages
  backendDir: lib/backend
  apiBasePath: /api
  envFiles: [.env, .env.local]
  plugins: []
  ota: false
  platforms:
    - web
    - android
    - ios
    - linux
    - macos
    - windows

  transitions:
    default: fade
    durationMs: 200
    curve: easeInOut

  seo:
    siteName: Passepartout
    defaultTitle: Profiles
    defaultDescription: A Dartvel application
