name: Partout tests

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - "master"
      - "hotfix/*"
    paths:
      - ".github/workflows/checks.yml"
      - ".github/workflows/test_partout.yml"
      - "ci/**"
      - "scripts/**"
      - "partout"
      - "partout/**"
      - "app-apple/Sources/CommonLibraryCore/Domain/Codegen/**"
      - "app-android/app/src/main/kotlin/com/algoritmico/passepartout/models/**"
      - "app-cross/models/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Run checks
    uses: ./.github/workflows/checks.yml
    with:
      suite: partout
