name: Release

on:
  push:
    tags:
      - "builds/*"

env:
  APPLE_ROOT: app-apple

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Run checks
    uses: ./.github/workflows/checks.yml

  release_info:
    name: Resolve release information
    runs-on: ubuntu-latest
    needs: checks
    timeout-minutes: 2
    outputs:
      version: ${{ steps.release_info.outputs.version }}
      build: ${{ steps.release_info.outputs.build }}
    steps:
      - uses: actions/checkout@v6
      - name: Read and validate app versions
        id: release_info
        run: |
          apple_version=$(app-apple/ci/version-number.sh)
          apple_build=$(app-apple/ci/build-number.sh)
          android_version=$(sed -nE \
            's/^[[:space:]]*versionName = "([^"]+)"[[:space:]]*$/\1/p' \
            app-android/app/build.gradle.kts)
          android_build=$(sed -nE \
            's/^[[:space:]]*versionCode = ([0-9]+)[[:space:]]*$/\1/p' \
            app-android/app/build.gradle.kts)

          test -n "$android_version"
          test -n "$android_build"
          test "$apple_version" = "$android_version"
          test "$apple_build" = "$android_build"

          echo "version=$apple_version" >> "$GITHUB_OUTPUT"
          echo "build=$apple_build" >> "$GITHUB_OUTPUT"

  package_apple:
    name: Package Apple apps
    needs: release_info
    uses: ./.github/workflows/package_apple.yml
    secrets: inherit

  package_android:
    name: Package Android app
    needs: release_info
    uses: ./.github/workflows/package_android.yml
    secrets: inherit

  distribute_public_beta:
    name: Distribute Public Beta
    runs-on: ubuntu-latest
    needs: [release_info, package_apple]
    continue-on-error: true
    strategy:
      fail-fast: true
      matrix:
        platform: [iOS, macOS, tvOS]
    environment:
      name: public_beta
    env:
      APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - name: Publish on TestFlight
        working-directory: ${{ env.APPLE_ROOT }}
        env:
          PILOT_APP_VERSION: ${{ needs.release_info.outputs.version }}
          PILOT_BUILD_NUMBER: ${{ needs.release_info.outputs.build }}
          PILOT_GROUPS: ${{ vars.PILOT_GROUPS }}
          PILOT_NOTIFY_EXTERNAL_TESTERS: ${{ vars.PILOT_NOTIFY_EXTERNAL_TESTERS }}
        run: bundle exec fastlane --env ${{ matrix.platform }} public_beta

  create_app_versions:
    name: Create App Store versions
    runs-on: ubuntu-latest
    needs: [release_info, package_apple]
    environment:
      name: app_store
    env:
      APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
      DELIVER_APP_VERSION: ${{ needs.release_info.outputs.version }}
    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - name: Create App Store versions
        continue-on-error: true
        working-directory: ${{ env.APPLE_ROOT }}
        run: |
          status=0
          for platform in iOS macOS tvOS; do
            bundle exec fastlane --env "$platform" asc_version || status=1
          done
          exit "$status"

  submit_for_app_review:
    name: Submit to App Review
    runs-on: ubuntu-latest
    needs: [release_info, package_apple, create_app_versions]
    continue-on-error: true
    strategy:
      fail-fast: true
      matrix:
        platform: [iOS, macOS, tvOS]
    environment:
      name: app_review
    env:
      APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
      DELIVER_APP_VERSION: ${{ needs.release_info.outputs.version }}
      DELIVER_BUILD_NUMBER: ${{ needs.release_info.outputs.build }}
      DELIVER_FORCE: true
    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - name: Submit for App Review
        working-directory: ${{ env.APPLE_ROOT }}
        run: bundle exec fastlane --env ${{ matrix.platform }} asc_review

  publish_release:
    name: Publish Release
    runs-on: ubuntu-latest
    needs:
      - release_info
      - package_apple
      - package_android
      - distribute_public_beta
      - create_app_versions
      - submit_for_app_review
    environment:
      name: release
    env:
      APP_VERSION: ${{ needs.release_info.outputs.version }}
      RELEASE_NOTES: app-apple/CHANGELOG.txt
    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.ACCESS_TOKEN }}
      - name: Download Apple DMGs
        uses: actions/download-artifact@v8
        with:
          pattern: apple-dmg-*
          path: artifacts/apple
          merge-multiple: true
      - name: Print workspace structure
        run: ls -R artifacts
      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@v7
        with:
          gpg_private_key: ${{ secrets.GPG_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
          git_user_signingkey: true
          git_commit_gpgsign: true
          git_tag_gpgsign: true
          git_push_gpgsign: false
      - name: Tag release
        run: |
          tag="v$APP_VERSION"
          git tag -as "$tag" -m "$tag"
          git push origin "$tag"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${APP_VERSION}" artifacts/apple/*.dmg* \
            --verify-tag \
            --title "$APP_VERSION" \
            --notes-file "$RELEASE_NOTES"
