name: Checks

on:
  workflow_call:
    inputs:
      run_checks:
        description: Run the test suites
        required: false
        default: true
        type: boolean

      suite:
        description: Test suite (empty runs all suites)
        required: false
        default: ""
        type: string

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run_tests:
    name: ${{ matrix.suite }} tests
    if: inputs.run_checks
    runs-on: ${{ matrix.suite == 'cross' && 'ubuntu-latest' || 'xcode-27' }}
    timeout-minutes: ${{ matrix.suite == 'cross' && 2 || 10 }}
    strategy:
      fail-fast: true
      matrix:
        suite: ${{ fromJSON(inputs.suite == '' && '["apple", "partout", "cross"]' || format('["{0}"]', inputs.suite)) }}
    steps:
      - uses: actions/checkout@v6

      - uses: partout-io/action-prepare-xcode-build@master
        if: matrix.suite == 'apple' || matrix.suite == 'partout'
        with:
          access-token: ${{ github.token }}
          submodules: true

      - uses: partout-io/setup-zig@main
        if: matrix.suite == 'partout'

      - uses: actions/setup-node@v6
        if: matrix.suite == 'api'
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Verify CMake file lists
        if: matrix.suite == 'cross'
        run: |
          app-cross/scripts/gen-cmake-files.sh
          if [[ -n "$(git status --porcelain)" ]]; then
            git status --short
            exit 1
          fi

      - name: Validate translations
        if: matrix.suite == 'apple'
        run: app-apple/scripts/clean-translations.sh

      - name: Run Apple tests
        if: matrix.suite == 'apple'
        run: ci/run-apple-tests.sh

      - name: Run Partout tests (Swift)
        if: matrix.suite == 'partout'
        run: ci/run-partout-swift-tests.sh

      - name: Verify model generation in both repositories
        if: matrix.suite == 'partout'
        run: |
          python3 partout/tests/codegen/test_codegen.py
          python3 partout/tests/codegen/test_parent_codegen.py .

      - name: Run Partout tests
        if: matrix.suite == 'partout'
        run: ci/run-partout-tests.sh

      - name: Run API tests
        if: matrix.suite == 'api'
        run: ci/run-api-tests.sh

  skip_checks:
    name: Checks skipped
    if: ${{ !inputs.run_checks }}
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - run: echo "Checks disabled for this run"
