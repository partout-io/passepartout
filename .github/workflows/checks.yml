name: Checks

on:
  workflow_call:
    inputs:
      run_checks:
        description: Run the test suites
        required: false
        default: true
        type: boolean

      suite:
        description: Test suite (empty runs all suites)
        required: false
        default: ""
        type: string

env:
  NODE_VERSION: "20"
  JAVA_VERSION: "17"
  ANDROID_API_LEVEL: "36"
  ANDROID_BUILD_TOOLS_VERSION: "36.0.0"
  CMAKE_VERSION: "4.1.2"
  ANDROID_NDK_VERSION: "30.0.16138531"

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run_tests:
    name: ${{ matrix.suite }} tests
    if: inputs.run_checks
    runs-on: ${{ (matrix.suite == 'cross' || matrix.suite == 'android' || (matrix.suite == 'partout' && github.event_name == 'pull_request')) && 'ubuntu-latest' || 'xcode-27' }}
    timeout-minutes: 15
    strategy:
      fail-fast: true
      matrix:
        suite: ${{ fromJSON(inputs.suite == '' && '["apple", "android", "partout", "cross"]' || format('["{0}"]', inputs.suite)) }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: ${{ matrix.suite == 'android' || (matrix.suite == 'partout' && github.event_name == 'pull_request') }}

      - uses: partout-io/action-prepare-xcode-build@master
        if: matrix.suite == 'apple' || (matrix.suite == 'partout' && github.event_name != 'pull_request')
        with:
          access-token: ${{ github.token }}
          submodules: true

      - uses: partout-io/setup-zig@main
        if: matrix.suite == 'partout'

      - uses: actions/setup-node@v6
        if: matrix.suite == 'api'
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: api/package-lock.json

      - uses: actions/setup-java@v6
        if: matrix.suite == 'android'
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - uses: android-actions/setup-android@v4
        if: matrix.suite == 'android'
        with:
          packages: platform-tools

      - name: Install Android SDK components
        if: matrix.suite == 'android'
        run: |
          sdkmanager \
            "platforms;android-${ANDROID_API_LEVEL}" \
            "build-tools;${ANDROID_BUILD_TOOLS_VERSION}" \
            "cmake;${CMAKE_VERSION}" \
            "ndk;${ANDROID_NDK_VERSION}"

      - name: Verify cross-platform generators
        if: matrix.suite == 'cross'
        run: |
          python3 app-cross/scripts/gen-cmake-files.py
          python3 -B app-cross/tests/string_generation.py
          python3 app-cross/scripts/import-apple-strings.py
          if [[ -n "$(git status --porcelain)" ]]; then
            git status --short
            exit 1
          fi

      - name: Validate translations
        if: matrix.suite == 'apple'
        run: app-apple/scripts/clean-translations.sh

      - name: Verify Passepartout model generation
        if: matrix.suite == 'partout'
        run: python3 ci/test_codegen.py

      - name: Verify Partout model generation
        if: matrix.suite == 'partout' && github.event_name != 'pull_request'
        run: python3 partout/tests/codegen/test_codegen.py

      - name: Run Apple tests
        if: matrix.suite == 'apple'
        run: ci/run-apple-tests.sh

      - name: Run Android tests
        if: matrix.suite == 'android'
        run: ci/run-android-tests.sh

      - name: Run Partout tests
        if: matrix.suite == 'partout' && github.event_name != 'pull_request'
        run: ci/run-partout-tests.sh

      - name: Run Partout tests (Swift)
        if: matrix.suite == 'partout' && github.event_name != 'pull_request'
        run: ci/run-partout-swift-tests.sh

      - name: Run API tests
        if: matrix.suite == 'api'
        run: ci/run-api-tests.sh

  skip_checks:
    name: Checks skipped
    if: ${{ !inputs.run_checks }}
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - run: echo "Checks disabled for this run"
