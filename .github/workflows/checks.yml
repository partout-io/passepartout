name: Checks

on:
  workflow_call:
    inputs:
      run_checks:
        description: Run the test suites
        required: false
        default: true
        type: boolean

      light:
        description: Skip Partout tests and run only affected app tests on PRs
        required: false
        default: false
        type: boolean

env:
  JAVA_VERSION: "17"
  ANDROID_API_LEVEL: "36"
  ANDROID_BUILD_TOOLS_VERSION: "36.0.0"
  CMAKE_VERSION: "4.1.2"
  ANDROID_NDK_VERSION: "30.0.16138531"

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  select_checks:
    name: Select affected apps
    if: inputs.run_checks
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      apple: ${{ steps.select.outputs.apple }}
      android: ${{ steps.select.outputs.android }}
      cross: ${{ steps.select.outputs.cross }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Select affected apps
        id: select
        run: |
          python3 - <<'PYTHON'
          import json
          import os
          import subprocess

          with open(os.environ['GITHUB_EVENT_PATH']) as source:
              event = json.load(source)
          apps = ['apple', 'android', 'cross']
          if 'pull_request' in event:
              pr = event['pull_request']
              changed = subprocess.check_output([
                  'git', 'diff', '--name-only', '-z', '--no-renames',
                  pr['base']['sha'] + '...' + pr['head']['sha'],
              ]).decode().split('\0')
              apps = [app for app in apps
                      if any(path.startswith('app-' + app + '/') for path in changed)]
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              for app in ['apple', 'android', 'cross']:
                  print(app + '=' + str(app in apps).lower(), file=output)
          PYTHON

  validation:
    name: Codegen and translations
    if: inputs.run_checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      - uses: partout-io/setup-zig@main

      - name: Verify cross-platform generators
        run: |
          app-android/scripts/import-apple-strings.sh
          python3 app-cross/scripts/gen-cmake-files.py
          python3 -B app-cross/tests/string_generation.py
          python3 app-cross/scripts/import-apple-strings.py
          if [[ -n "$(git status --porcelain)" ]]; then
            git status --short
            exit 1
          fi

      - name: Validate translations
        run: app-apple/scripts/clean-translations.sh

      - name: Verify Passepartout model generation
        run: python3 ci/test_codegen.py

  apple:
    name: Apple tests
    needs: select_checks
    if: needs.select_checks.outputs.apple == 'true'
    runs-on: xcode-27
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: partout-io/action-prepare-xcode-build@master
        with:
          access-token: ${{ github.token }}
          submodules: true

      - name: Run Apple tests
        run: ci/run-apple-tests.sh

  android:
    name: Android tests
    needs: select_checks
    if: needs.select_checks.outputs.android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android SDK components
        run: |
          sdkmanager \
            "platforms;android-${ANDROID_API_LEVEL}" \
            "build-tools;${ANDROID_BUILD_TOOLS_VERSION}" \
            "cmake;${CMAKE_VERSION}" \
            "ndk;${ANDROID_NDK_VERSION}"

      - name: Run Android tests
        run: ci/run-android-tests.sh

  partout:
    name: Partout tests
    if: inputs.run_checks && !inputs.light
    runs-on: xcode-27
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: partout-io/action-prepare-xcode-build@master
        with:
          access-token: ${{ github.token }}
          submodules: true

      - uses: partout-io/setup-zig@main

      - name: Verify Partout model generation
        run: python3 partout/tests/codegen/test_codegen.py

      - name: Run Partout tests
        run: ci/run-partout-tests.sh

      - name: Run Partout tests (Swift)
        run: ci/run-partout-swift-tests.sh

  cross_application:
    name: Cross tests (${{ matrix.os }})
    needs: select_checks
    if: needs.select_checks.outputs.cross == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - name: Configure portable tests and Windows adapter compile check
        run: cmake -S app-cross/tests -B build/cross -DCMAKE_BUILD_TYPE=Debug
      - name: Build
        run: cmake --build build/cross --config Debug --parallel 2
      - name: Test
        run: ctest --test-dir build/cross -C Debug --output-on-failure

  skip_checks:
    name: Checks skipped
    if: ${{ !inputs.run_checks }}
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - run: echo "Checks disabled for this run"
