name: Distribute Apple apps

on:
  workflow_call:
    inputs:
      version:
        description: App version to distribute
        required: true
        type: string
      build:
        description: App build number to distribute
        required: true
        type: string
    secrets:
      APP_STORE_CONNECT_API_KEY:
        required: true

env:
  APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}

defaults:
  run:
    working-directory: app-apple

jobs:
  distribute_public_beta:
    name: Distribute Public Beta (${{ matrix.platform }})
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: true
      matrix:
        platform: [iOS, macOS, tvOS]
    environment:
      name: public_beta
    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - name: Publish on TestFlight
        env:
          PILOT_APP_VERSION: ${{ inputs.version }}
          PILOT_BUILD_NUMBER: ${{ inputs.build }}
          PILOT_GROUPS: ${{ vars.PILOT_GROUPS }}
          PILOT_NOTIFY_EXTERNAL_TESTERS: ${{ vars.PILOT_NOTIFY_EXTERNAL_TESTERS }}
        run: bundle exec fastlane --env ${{ matrix.platform }} public_beta

  create_app_versions:
    name: Create App Store versions
    runs-on: ubuntu-latest
    environment:
      name: app_store
    env:
      DELIVER_APP_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - name: Create App Store versions
        continue-on-error: true
        run: |
          status=0
          for platform in iOS macOS tvOS; do
            bundle exec fastlane --env "$platform" asc_version || status=1
          done
          exit "$status"

  submit_for_app_review:
    name: Submit to App Review (${{ matrix.platform }})
    runs-on: ubuntu-latest
    needs: create_app_versions
    continue-on-error: true
    strategy:
      fail-fast: true
      matrix:
        platform: [iOS, macOS, tvOS]
    environment:
      name: app_review
    env:
      DELIVER_APP_VERSION: ${{ inputs.version }}
      DELIVER_BUILD_NUMBER: ${{ inputs.build }}
      DELIVER_FORCE: true
    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - name: Submit for App Review
        run: bundle exec fastlane --env ${{ matrix.platform }} asc_review
