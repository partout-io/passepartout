name: Tests

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - "master"
      - "hotfix/*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Run light checks
    uses: ./.github/workflows/checks.yml
    with:
      light: true
